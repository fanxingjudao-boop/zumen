<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>図面・地図検索UI（実運用版）</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>図面・地図検索UI（実運用向け）</h1>
      <p>検索結果を図面とオフライン地図へ連携し、現場確認を効率化</p>
    </header>

    <main class="layout">
      <section class="panel search-panel" aria-labelledby="search-title">
        <h2 id="search-title">設備検索</h2>
        <form id="searchForm" class="search-form">
          <label>
            キーワード
            <input id="keyword" type="text" placeholder="例: A-102 玄関 / 分電盤" />
          </label>

          <label>
            建物
            <select id="building">
              <option value="all">すべて</option>
              <option value="north">北棟</option>
              <option value="south">南棟</option>
            </select>
          </label>

          <label>地図モード
            <select id="mapMode">
              <option value="offline">オフライン</option>
              <option value="online">オンライン（確認用）</option>
            </select>
          </label>

          <div class="actions">
            <button type="submit" class="primary">検索</button>
            <button type="button" id="clearBtn">条件クリア</button>
          </div>
        </form>

        <div class="quick-filters" aria-label="クイックフィルター">
          <button class="chip" data-filter="entrance">玄関</button>
          <button class="chip" data-filter="evacuation">避難設備</button>
          <button class="chip" data-filter="electrical">電気設備</button>
        </div>

        <p id="resultMeta" class="meta" aria-live="polite">検索結果: 0件</p>
        <ul id="resultList" class="result-list" aria-label="検索結果一覧"></ul>
      </section>

      <section class="panel viewer-panel" aria-labelledby="viewer-title">
        <div class="viewer-header">
          <h2 id="viewer-title">確認ビュー</h2>
          <div class="toggle-group" role="tablist" aria-label="表示切替">
            <button class="tab active" data-view="drawing" role="tab" aria-selected="true">図面</button>
            <button class="tab" data-view="map" role="tab" aria-selected="false">地図</button>
            <button class="tab" data-view="split" role="tab" aria-selected="false">並列</button>
          </div>
        </div>

        <div class="hint">
          <strong>運用ポイント:</strong>
          設備を選択すると、図面セルとオフライン地図（nearby_map）へ同時反映します。
        </div>

        <div class="actions" style="margin-bottom:8px;">
          <button type="button" id="openBlueprintBtn">図面一覧を開く</button>
          <button type="button" id="openMapNewTabBtn">地図を新規タブで開く</button>
        </div>

        <div id="canvasArea" class="canvas-area split">
          <article class="canvas drawing" aria-label="図面表示">
            <h3>図面（セル管理）</h3>
            <div class="grid" id="drawingGrid"></div>
          </article>

          <article class="canvas map" aria-label="地図表示">
            <h3>地図（オフライン連携）</h3>
            <iframe id="mapFrame" title="オフライン地図ビュー" loading="lazy"></iframe>
          </article>
        </div>

        <aside class="selection-info" id="selectionInfo">
          項目を選択すると、図面セル・地図中心・位置マーカーを同期表示します。
        </aside>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
