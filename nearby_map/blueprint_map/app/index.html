<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>図面マップUI（サンプル）</title>
    <style>
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f8fafc; color:#0f172a; }
      header { padding: 16px 20px; background:#0f172a; color:#fff; }
      nav { display:flex; gap:8px; padding: 10px 16px; background:#fff; border-bottom:1px solid #e2e8f0; }
      .tab { border:1px solid #cbd5e1; background:#fff; border-radius:8px; padding:8px 12px; cursor:pointer; }
      .tab.active { background:#dbeafe; border-color:#93c5fd; color:#1d4ed8; font-weight:700; }
      main { padding: 16px; }
      .blueprint-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
      .blueprint-card { background:#fff; border:1px solid #cbd5e1; border-radius:12px; padding:12px; cursor:pointer; }
      .icon { font-size: 28px; }
      .title { margin-top: 8px; font-weight:600; }
      .meta { color:#475569; font-size:0.9rem; margin-top:4px; }
      .new-tab-icon { margin-left:4px; opacity:0.7; }
    </style>
  </head>
  <body>
    <header>
      <h1>図面マップ（サンプル）</h1>
      <p>将来の図面DB連携を想定したUI雛形です。</p>
    </header>

    <nav>
      <button class="tab active" type="button">📋 図面一覧</button>
      <button class="tab" type="button">🔍 検索</button>
      <button class="tab" type="button">⚙️ 設定</button>
      <button class="tab" type="button" onclick="openNearbyMap()">🗺️ 周辺地図<span class="new-tab-icon">↗</span></button>
    </nav>

    <main>
      <div class="blueprint-grid">
        <div class="blueprint-card" onclick="notifyFutureFeature()">
          <div class="icon">📄</div>
          <div class="title">配管図 A-01</div>
          <div class="meta">中央エリア / 1F</div>
        </div>
        <div class="blueprint-card" onclick="notifyFutureFeature()">
          <div class="icon">📄</div>
          <div class="title">電気配線図 E-01</div>
          <div class="meta">中央エリア / B1F</div>
        </div>
        <div class="blueprint-card" onclick="notifyFutureFeature()">
          <div class="icon">📄</div>
          <div class="title">防災設備図 F-02</div>
          <div class="meta">南棟 / 2F</div>
        </div>
      </div>
    </main>

    <script>
      function openNearbyMap() {
        window.open('../../app/index.html', '_blank');
      }

      function notifyFutureFeature() {
        alert('図面詳細機能は今後実装予定です。');
      }
    </script>
  </body>
</html>
